# Defect Image Generation (DIG) Configuration
# Runs inside the DIG Brev Launchable environment

defect_generation:
  surface_types:
    - automotive_body_panel
    - metal_sheet
    - bumper_plastic

  defect_types:
    scratch:
      length: [0.01, 0.15] # meters
      depth: [0.0001, 0.002] # meters
      orientation: [0, 360] # degrees
    orange_peel:
      severity_level: [1, 5]
    fish_eye:
      diameter: [0.001, 0.005] # meters
      count: [1, 10]
    dust_nib:
      size: [0.0005, 0.002] # meters
      density: [1, 20] # per sq meter
    run_sag:
      length: [0.02, 0.2] # meters
      width: [0.005, 0.03] # meters
    color_mismatch:
      delta_e_range: [1.0, 5.0]
    blister:
      size: [0.002, 0.01] # meters
      count: [1, 15]
    pinhole:
      diameter: [0.0001, 0.001] # meters
      density: [10, 100] # per sq meter

  camera:
    distance: [0.5, 2.0] # meters
    angle: [0, 45] # degrees from normal
    resolutions:
      - [1920, 1080]
      - [3840, 2160]

  lighting:
    - overhead_led
    - angled_spot
    - natural_daylight
    - factory_fluorescent

  domain_randomization:
    surface_roughness: [0.1, 0.9]
    surface_color_hsv_variation: [0.1, 0.1, 0.2]
    background_clutter: true

  output:
    format:
      - images
      - bounding_box
      - segmentation_mask
    images_per_defect_type: 1000
    directory_paths:
      images: "/data/synthetic/images"
      labels: "/data/synthetic/labels"
      masks: "/data/synthetic/masks"
